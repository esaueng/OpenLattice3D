# Keep pinned GitHub Actions current. The pin check in CI rejects mutable
# refs, so Dependabot bumps the reviewed SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint currently supports TypeScript <6.1. Keep major compiler
    # upgrades deferred until the lint toolchain supports them.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
