# Deployment is owned by Cloudflare Workers Builds, which is connected to this
# repository and publishes on push to main (the "Workers Builds: openlattice3d"
# check). This workflow must not publish, or the two would race on the same push.
name: Cloudflare build check

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  # Verifies what Workers Builds actually published. It cannot be a step of a
  # deploy job here, because this workflow no longer deploys -- and Actions is
  # not notified when Workers Builds finishes, so the retry window below is what
  # absorbs that lag.
  #
  # Disabled by default: Cloudflare returns 403 to GitHub's runner IP ranges for
  # both hosts (verified -- every User-Agent gets 200 from a residential IP, and
  # all 40 attempts got 403 from a runner), so this cannot pass until those
  # requests are allowed through. To enable, add a WAF skip rule for /health and
  # set the repository variable DEPLOY_SMOKE_ENABLED to 'true'.
  smoke:
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_SMOKE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke test deployed health endpoints
        shell: bash
        run: |
          set -euo pipefail

          readonly expected_body='{"status":"ok"}'
          readonly expected_content_type='application/json; charset=utf-8'
          readonly expected_cache_control='no-store'
          # Widened from 5x5s: that window assumed the deploy had just finished in
          # this same job. Workers Builds publishes asynchronously and Actions is not
          # told when, so this has to outlast a cold build (~5 minutes of tolerance).
          readonly max_attempts=20
          readonly retry_delay_seconds=15
          readonly headers_file="${RUNNER_TEMP}/openlattice-health-headers"
          readonly body_file="${RUNNER_TEMP}/openlattice-health-body"
          readonly -a endpoints=(
            'https://openlattice3d.com/health'
            'https://lattice.esau.app/health'
          )

          read_header() {
            local header_name="$1"

            awk -v expected="${header_name}" '
              {
                line = $0
                sub(/\r$/, "", line)
                separator = index(line, ":")
                if (separator > 0 && tolower(substr(line, 1, separator - 1)) == expected) {
                  value = substr(line, separator + 1)
                  sub(/^[[:space:]]+/, "", value)
                }
              }
              END { print value }
            ' "${headers_file}"
          }

          check_endpoint() {
            local url="$1"
            local attempt http_status body content_type cache_control

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              : > "${headers_file}"
              : > "${body_file}"

              if http_status="$(curl --disable --silent --show-error \
                --connect-timeout 5 --max-time 10 \
                --header 'Accept: application/json' \
                --header 'Cache-Control: no-cache' \
                --dump-header "${headers_file}" \
                --output "${body_file}" \
                --write-out '%{http_code}' \
                "${url}")"; then
                body="$(<"${body_file}")"
                content_type="$(read_header 'content-type')"
                cache_control="$(read_header 'cache-control')"

                if [[ "${http_status}" == '200' \
                  && "${body}" == "${expected_body}" \
                  && "${content_type}" == "${expected_content_type}" \
                  && "${cache_control}" == "${expected_cache_control}" ]]; then
                  printf 'Health check passed for %s.\n' "${url}"
                  return 0
                fi
              fi

              printf 'Health check attempt %d/%d failed for %s (HTTP %s).\n' \
                "${attempt}" "${max_attempts}" "${url}" "${http_status:-curl-error}"
              if ((attempt < max_attempts)); then
                sleep "${retry_delay_seconds}"
              fi
            done

            printf 'Health check failed for %s after %d attempts.\n' "${url}" "${max_attempts}" >&2
            return 1
          }

          smoke_failed=0
          # Give Workers Builds a head start before the first attempt.
          sleep 15
          for endpoint in "${endpoints[@]}"; do
            if ! check_endpoint "${endpoint}"; then
              smoke_failed=1
            fi
          done
          exit "${smoke_failed}"
