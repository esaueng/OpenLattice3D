name: Commit privacy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  # PR branches are covered by pull_request_target; push runs are for main
  # and tags only.
  push:
    branches: [main]
    tags: ["**"]
  merge_group:

permissions:
  contents: read

# A newer event for the same PR checks its current base..head range, so it
# supersedes the older run. Push and merge-group runs each check their own
# range and never share a group.
concurrency:
  group: commit-privacy-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  commit-privacy:
    name: commit-privacy-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/privacy
      # This branch-controlled convenience check has no publishing permission.
      # The required App-bound verdict comes from the protected History workflow.
      - name: Check new commit identities without publishing a merge verdict
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/privacy/commit_privacy.py
