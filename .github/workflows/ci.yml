name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    uses: esaueng/OpenLattice3D/.github/workflows/trusted-ci.yml@c5667f4d9161b14553010224947b420b542afbd9

  ci:
    name: ci
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
