name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    uses: esaueng/OpenLattice3D/.github/workflows/trusted-ci.yml@f8cffbb613f5a1abae90e7cdd3d9aee8102a6f36

  ci:
    name: ci
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
