name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenLattice3D/.github/workflows/fleet-ci.yml@15cc6887708711ad88eb982b83b98aab4613bc57

  # Branch protection requires this exact name outside the reusable workflow.
  ci:
    name: ci
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
