name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenLattice3D/.github/workflows/fleet-ci.yml@d1c17f2e0b9a6c75d3f2a1da8a8f82e50c2cac2a

  # Branch protection requires this exact name outside the reusable workflow.
  ci:
    name: ci
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
