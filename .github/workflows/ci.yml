name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenLattice3D/.github/workflows/fleet-ci.yml@8b9a88a429cc18539c08f86014d951d716b71e13 # reviewed workflow (unreleased)

  # Branch protection requires this exact name outside the reusable workflow.
  ci:
    name: ci
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check workflow action pins
        run: node scripts/check-workflow-pins.mjs
      - name: Verify agent docs
        run: node scripts/verify-agent-docs.mjs
